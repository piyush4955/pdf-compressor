<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background shape -->
  <rect x="50" y="50" width="500" height="300" rx="20" fill="#f0f4ff" />
  
  <!-- PDF Document -->
  <g transform="translate(150, 100)">
    <!-- Document base -->
    <rect x="0" y="0" width="120" height="160" rx="5" fill="#ffffff" stroke="#4361ee" stroke-width="2" />
    
    <!-- PDF Icon -->
    <rect x="20" y="20" width="80" height="80" rx="5" fill="#4361ee" />
    <text x="60" y="70" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
    
    <!-- Document lines -->
    <rect x="20" y="120" width="80" height="5" rx="2" fill="#e0e0e0" />
    <rect x="20" y="135" width="60" height="5" rx="2" fill="#e0e0e0" />
  </g>
  
  <!-- Arrow -->
  <g transform="translate(300, 180)">
    <path d="M0,0 L40,0 M30,-10 L40,0 L30,10" stroke="#4361ee" stroke-width="3" fill="none" />
  </g>
  
  <!-- Compressed PDF -->
  <g transform="translate(350, 120)">
    <!-- Document base -->
    <rect x="0" y="0" width="100" height="120" rx="5" fill="#ffffff" stroke="#4361ee" stroke-width="2" />
    
    <!-- PDF Icon -->
    <rect x="15" y="15" width="70" height="60" rx="5" fill="#4cc9f0" />
    <text x="50" y="50" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
    
    <!-- Document lines -->
    <rect x="15" y="90" width="70" height="4" rx="2" fill="#e0e0e0" />
    <rect x="15" y="100" width="50" height="4" rx="2" fill="#e0e0e0" />
    
    <!-- Compression indicator -->
    <circle cx="80" cy="25" r="12" fill="#f72585" />
    <text x="80" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">↓</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="15" fill="#f72585" opacity="0.2" />
  <circle cx="500" cy="300" r="25" fill="#4cc9f0" opacity="0.2" />
  <circle cx="450" cy="100" r="10" fill="#f72585" opacity="0.2" />
  <circle cx="150" cy="320" r="20" fill="#4361ee" opacity="0.2" />
</svg>